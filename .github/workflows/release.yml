name: Release FikPanel Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nama tag rilis (misal: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Svelte Frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Determine Release Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "val=${RAW_TAG}" >> $GITHUB_OUTPUT
          CLEAN_VER="${RAW_TAG#v}"
          echo "clean_ver=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Build Linux amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          TAG_VER: ${{ steps.tag.outputs.clean_ver }}
        run: |
          mkdir -p dist/linux-amd64
          go build -ldflags="-s -w -X main.version=${TAG_VER}" -o dist/linux-amd64/fikpanel ./cmd/fikpanel
          tar -czf dist/fikpanel-linux-amd64.tar.gz -C dist/linux-amd64 fikpanel

      - name: Build Linux arm64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
          TAG_VER: ${{ steps.tag.outputs.clean_ver }}
        run: |
          mkdir -p dist/linux-arm64
          go build -ldflags="-s -w -X main.version=${TAG_VER}" -o dist/linux-arm64/fikpanel ./cmd/fikpanel
          tar -czf dist/fikpanel-linux-arm64.tar.gz -C dist/linux-arm64 fikpanel

      - name: Build Windows amd64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
          TAG_VER: ${{ steps.tag.outputs.clean_ver }}
        run: |
          mkdir -p dist/windows-amd64
          go build -ldflags="-s -w -X main.version=${TAG_VER}" -o dist/windows-amd64/fikpanel.exe ./cmd/fikpanel
          cd dist/windows-amd64 && zip ../fikpanel-windows-amd64.zip fikpanel.exe && cd ../..

      - name: Generate Checksums & Release Notes
        id: release_meta
        run: |
          TAG_VAL="${{ steps.tag.outputs.val }}"
          
          # Hitung Checksum SHA-256 dan Ukuran Berkas
          cd dist
          sha256sum fikpanel-linux-amd64.tar.gz > SHA256SUMS.txt
          sha256sum fikpanel-linux-arm64.tar.gz >> SHA256SUMS.txt
          sha256sum fikpanel-windows-amd64.zip >> SHA256SUMS.txt
          
          SHA_LINUX_AMD64=$(sha256sum fikpanel-linux-amd64.tar.gz | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum fikpanel-linux-arm64.tar.gz | awk '{print $1}')
          SHA_WIN_AMD64=$(sha256sum fikpanel-windows-amd64.zip | awk '{print $1}')
          
          SIZE_LINUX_AMD64=$(ls -lh fikpanel-linux-amd64.tar.gz | awk '{print $5}')
          SIZE_LINUX_ARM64=$(ls -lh fikpanel-linux-arm64.tar.gz | awk '{print $5}')
          SIZE_WIN_AMD64=$(ls -lh fikpanel-windows-amd64.zip | awk '{print $5}')
          cd ..
          
          cat <<EOF > release_body.md
          ## FikPanel ${TAG_VAL}

          > **FikPanel** adalah Lightweight Linux Server Control Panel mandiri dengan arsitektur *Single Binary* (Go 1.24 + Svelte 5 Runes + embedded SQLite WAL). Zero external runtime dependencies, konsumsi RAM idle ultra-rendah (< 25 MB), dan instalasi instan.

          ---

          ### ⚡ Instalasi Cepat (Server Baru / AWS / VPS)
          \`\`\`bash
          curl -sSL https://raw.githubusercontent.com/FikFikk/fikpanel/main/scripts/install.sh | sudo bash
          \`\`\`

          ### 🔄 Pembaruan Tanpa Downtime (Server Sudah Terpasang)
          \`\`\`bash
          sudo fikpanel update
          \`\`\`
          *Konfigurasi website, virtual host Nginx, dan database pengguna dijamin aman 100% tanpa downtime.*

          ---

          ### 📊 Release by the Numbers
          | Parameter | Nilai / Spesifikasi |
          |---|---|
          | **Default Port** | \`1405\` (HTTP/HTTPS) |
          | **Arsitektur Binary** | Linux (x86_64, ARM64), Windows (x64) |
          | **Frontend Engine** | Svelte 5 (Runes) embedded via Go \`embed.FS\` |
          | **Database Engine** | Embedded SQLite dengan Write-Ahead Logging (WAL) |
          | **Memory Footprint** | ~12 - 25 MB RAM saat idle |

          ---

          ### 📦 Paket Distribusi & Verifikasi Checksum SHA-256
          | Berkas Paket | Arsitektur | Ukuran | Checksum SHA-256 |
          |---|---|---|---|
          | \`fikpanel-linux-amd64.tar.gz\` | Linux x86_64 / amd64 | ${SIZE_LINUX_AMD64} | \`${SHA_LINUX_AMD64}\` |
          | \`fikpanel-linux-arm64.tar.gz\` | Linux aarch64 / arm64 | ${SIZE_LINUX_ARM64} | \`${SHA_LINUX_ARM64}\` |
          | \`fikpanel-windows-amd64.zip\` | Windows x64 | ${SIZE_WIN_AMD64} | \`${SHA_WIN_AMD64}\` |

          ---

          ### 📝 Ringkasan Pembaruan (Changelog)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FikPanel ${{ steps.tag.outputs.val }}
          tag_name: ${{ steps.tag.outputs.val }}
          body_path: release_body.md
          files: |
            dist/fikpanel-linux-amd64.tar.gz
            dist/fikpanel-linux-arm64.tar.gz
            dist/fikpanel-windows-amd64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true


