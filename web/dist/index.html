    <script>
      // Terapkan atribut data-theme dari localStorage sebelum bundle dimuat agar tidak berkedip
      (function () {
        try {
          var t = localStorage.getItem('fp:theme');
          document.documentElement.setAttribute(
            'data-theme',
            t === 'light' || t === 'dark' || t === 'auto' ? t : 'dark'
          );
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
