# Konfigurasi live-reload Air untuk backend Go FikPanel
root = "."
testdata_dir = "testdata"
tmp_dir = "bin/tmp"

[build]
  args_bin = ["serve", "--dev", "--port=8443"]
  bin = ".\\bin\\tmp\\fikpanel.exe"
  entrypoint = [".\\bin\\tmp\\fikpanel.exe"]
  cmd = "go build -o .\\bin\\tmp\\fikpanel.exe .\\cmd\\fikpanel"
  delay = 500
  exclude_dir = ["bin", "web", "packaging", "scripts", ".git"]
  exclude_file = []
  exclude_regex = ["_test\\.go", ".*\\.db.*"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "internal"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
